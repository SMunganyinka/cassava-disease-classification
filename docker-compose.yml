services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      MODEL_PATH: /app/models/cassava_model.keras
      METRICS_PATH: /app/results/metrics/metrics.json
      UPLOAD_DIR: /app/data/uploaded
      BASE_MANIFEST_PATH: /app/data/cassava_cache/224/manifest.csv
      RETRAINING_HISTORY_PATH: /app/results/retraining_history.json
      MODEL_VERSION: ${MODEL_VERSION:-local}
    volumes:
      - ./models:/app/models
      - ./results:/app/results
      - uploaded_data:/app/data/uploaded
      - ./data/cassava_cache:/app/data/cassava_cache:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    command: python -m streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      API_URL: http://nginx
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./results:/app/results:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  uploaded_data:

